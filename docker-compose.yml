services:

  # ─── MySQL Database ───────────────────────────────────
  db:
    image: mysql:8.0
    container_name: dpniti_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dpniti_root_pass
      MYSQL_DATABASE: auth_db
      MYSQL_USER: dpniti_user
      MYSQL_PASSWORD: dpniti_pass
    volumes:
      - db_data:/var/lib/mysql
      # CHANGED: login_schema.sql replaces the old frontend/auth_db.sql (users table)
      - ./database/login_schema.sql:/docker-entrypoint-initdb.d/01_login_schema.sql
        # Removed db7.sql to prevent chatbot's INSERT-only parsed data dump from executing
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10


  # ─── PostgreSQL academic-data database (separate from MySQL auth) ───
  academic-db:
    image: postgres:16-alpine
    container_name: dpniti_academic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dpniti_academic
      POSTGRES_USER: dpniti_academic_user
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD:?Set ACADEMIC_DB_PASSWORD in the root .env}
    volumes:
      - academic_db_data:/var/lib/postgresql/data
      # Creates the academic tables and imports the chatbot data on first start.
      - ./chatbot/postgres_init.sql:/docker-entrypoint-initdb.d/01_academic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpniti_academic_user -d dpniti_academic"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"

  # ─── Node.js Backend ──────────────────────────────────
  backend:
    build: ./backend
    container_name: dpniti_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: dpniti_user
      DB_PASSWORD: dpniti_pass
      DB_DATABASE: auth_db
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}   # ADDED: set a long random value in your .env
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}   # ADDED: exact origin(s) allowed to send credentials
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # ADDED: set to "true" only once served over real HTTPS
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  # ─── Python Chatbot ───────────────────────────────────
  chatbot:
    build: ./chatbot
    container_name: dpniti_chatbot
    restart: unless-stopped
    environment:
      ACADEMIC_DATABASE_URL: postgresql+psycopg://dpniti_academic_user:${ACADEMIC_DB_PASSWORD}@academic-db:5432/dpniti_academic
      PG_POOL_SIZE: ${PG_POOL_SIZE:-5}
      PG_MAX_OVERFLOW: ${PG_MAX_OVERFLOW:-5}
      LANGFUSE_ENABLED: "true"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-${GEMINI_API_KEY}}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}   # ADDED: same secret as backend, so it can verify tokens too
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}   # ADDED: exact origin(s) allowed to send credentials
    depends_on:
      db:
        condition: service_healthy
      academic-db:
        condition: service_healthy
    ports:
      - "5001:5001"

  # ─── Nginx Frontend ───────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: dpniti_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - chatbot

volumes:
  db_data:
  academic_db_data:
